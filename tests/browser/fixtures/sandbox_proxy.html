<!doctype html>
<html>
  <body>
    <script>
      // A sandbox proxy as the MCP Apps specification describes one, reduced to
      // what the tests read: it reports what the host sent it, then relays.
      const inner = document.createElement("iframe");
      inner.setAttribute("sandbox", "allow-scripts");
      document.body.append(inner);
      window.addEventListener("message", (event) => {
        if (event.source === window.parent) {
          const data = event.data;
          if (data && data.method === "ui/notifications/sandbox-resource-ready") {
            window.parent.postMessage(
              { kind: "proxy-received", params: data.params, query: location.search },
              "*",
            );
            inner.srcdoc = data.params.html;
            return;
          }
          inner.contentWindow.postMessage(data, "*");
        } else if (event.source === inner.contentWindow) {
          window.parent.postMessage(event.data, "*");
        }
      });
      window.parent.postMessage(
        { jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} },
        "*",
      );
    </script>
  </body>
</html>
