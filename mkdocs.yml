site_name: agents-web-components
site_description: Framework-free Web Components over the AG-UI protocol - chat, threads, inbox and an agents provider.
site_url: https://artui.github.io/agents-web-components/
repo_url: https://github.com/Artui/agents-web-components
repo_name: Artui/agents-web-components
edit_uri: edit/main/docs/
exclude_docs: |
  requirements.txt

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

# mkdocs reports an unresolved anchor at INFO, so a link to a heading that moved stays
# broken through a clean --strict build. Warnings are errors under --strict.
validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  # GitHub's slugs, so an anchor carried over from the old single-page README still resolves.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quickstart: quickstart.md
      - Authenticating requests: authentication.md
      - Core concepts: concepts.md
  - The chat:
      - Header, collapse and resizing: header-and-panel.md
      - Messages: messages.md
      - Tool calls and sub-agents: tool-calls.md
      - What the server draws: server-pushed-ui.md
      - Skills and run notices: skills.md
      - File uploads: uploads.md
  - Other elements:
      - The conversation list: threads.md
      - The threads contract: threads-contract.md
      - Agents and the inbox: agents.md
      - The editors on a page of their own: editors.md
  - Hosting:
      - Host seams (SPA): host-seams.md
      - Durability and resuming: durability.md
  - Look and language:
      - Theming, density and placement: theming.md
      - Internationalization: i18n.md
  - Reference:
      - Public API surface: api.md
      - Building and compatibility: building.md
      - Moving from ag-ui-web-component: migration.md
