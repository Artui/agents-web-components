<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agents-web-components — agents home</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1a1a2e;
        background: #f7f7fb;
      }
      header {
        height: 52px;
        overflow: hidden;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 20px;
        background: #15151f;
        color: #fff;
      }
      header button[aria-pressed="true"] {
        background: #9cc2ff;
        color: #15151f;
      }
      aside {
        position: fixed;
        inset: 52px auto 0 0;
        width: 292px;
        padding: 0 16px 16px 20px;
        overflow-y: auto;
      }
      @media (max-width: 640px) {
        aside {
          inset: 52px 0 auto 0;
          width: auto;
          height: 220px;
          padding: 0 20px 8px;
          border-bottom: 1px solid #d8d8e4;
        }
      }
      aside h2 {
        font-size: 0.9rem;
        margin: 12px 0 6px;
      }
      header ag-ui-inbox {
        margin-inline-start: auto;
        color: #fff;
      }
      /* placement="page" is fixed to the viewport and sizes itself to it, so the
         host states the box it leaves: inset, width and height together. The rail is
         a fixed column wide, and a 220px strip under the header at 640px and below. */
      ag-ui-chat {
        --ag-ui-inset: 52px 0 0 292px;
        --ag-ui-width: calc(100vw - 292px);
        --ag-ui-height: calc(100dvh - 52px);
      }
      @media (max-width: 640px) {
        ag-ui-chat {
          --ag-ui-inset: 272px 0 0 0;
          --ag-ui-width: 100vw;
          --ag-ui-height: calc(100dvh - 272px);
        }
      }
      nav a {
        margin-inline-end: 8px;
        font-size: 0.85rem;
      }
      .log {
        font: 12px ui-monospace, monospace;
        padding: 0 0 0 16px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <ag-ui-agents
      id="home"
      data-agents-url="/agents-home/agents/"
      data-inbox-url="/agents-home/inbox/"
      style="display: contents"
    >
      <header>
        <strong>Agents home</strong>
        <span id="agents" role="group" aria-label="Agents"></span>
        <ag-ui-inbox></ag-ui-inbox>
      </header>
        <aside>
          <h2>Needs you, every agent</h2>
          <ag-ui-inbox variant="list"></ag-ui-inbox>
          <h2>This agent's conversations</h2>
          <ag-ui-threads></ag-ui-threads>
          <nav aria-label="Each piece alone">
            <a href="/agents/alone.html?piece=inbox">inbox alone</a>
            <a href="/agents/alone.html?piece=threads">threads alone</a>
            <a href="/agents/alone.html?piece=chat">chat alone</a>
          </nav>
          <h2>Provider events</h2>
          <ol class="log" id="log" aria-label="Provider events"></ol>
        </aside>
      <ag-ui-chat placement="page" data-greeting="off" data-start-open></ag-ui-chat>
    </ag-ui-agents>
    <script type="module" src="/agents/agents.js"></script>
    <script src="/viewport-readout.js"></script>
  </body>
</html>
